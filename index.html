<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x3led</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --text: #fff;
    --text-dim: #a0a0a0;
    --text-faint: #444;
    --text-tagline: #666;
    --border: #2a2a2a;
    --btn-bg: #161616;
    --btn-border: #222;
    --btn-text: #ccc;
    --btn-hover-bg: #1e1e1e;
    --btn-hover-border: #333;
    --btn-active-bg: #fff;
    --btn-active-text: #000;
    --modal-bg: #0f0f0f;
    --modal-border: #1e1e1e;
    --scroll-track: #0a0a0a;
    --scroll-thumb: #222;
    --float-opacity: 0.018;
    --cursor-color: #fff;
  }

  [data-theme="light"] {
    --bg: #f5f5f5;
    --text: #0a0a0a;
    --text-dim: #555;
    --text-faint: #aaa;
    --text-tagline: #888;
    --border: #d0d0d0;
    --btn-bg: #ffffff;
    --btn-border: #d0d0d0;
    --btn-text: #333;
    --btn-hover-bg: #efefef;
    --btn-hover-border: #b0b0b0;
    --btn-active-bg: #000;
    --btn-active-text: #fff;
    --modal-bg: #ffffff;
    --modal-border: #e0e0e0;
    --scroll-track: #f5f5f5;
    --scroll-thumb: #ccc;
    --float-opacity: 0.04;
    --cursor-color: #000;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    transition: background 0.4s ease, color 0.4s ease;
    cursor: none;
  }

  @media (hover: none) {
    html, body { cursor: auto; }
    .cursor, .cursor-dot { display: none !important; }
  }

  .cursor {
    position: fixed; top: 0; left: 0;
    width: 20px; height: 20px;
    border: 1.5px solid var(--cursor-color);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s, height 0.25s, background 0.25s, opacity 0.2s;
    mix-blend-mode: difference;
    opacity: 0;
  }
  .cursor.visible { opacity: 1; }
  .cursor.hover { width: 46px; height: 46px; background: rgba(255,255,255,0.1); }
  [data-theme="light"] .cursor { mix-blend-mode: normal; }

  .cursor-dot {
    position: fixed; top: 0; left: 0;
    width: 5px; height: 5px;
    background: var(--cursor-color);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  .cursor-dot.visible { opacity: 1; }

  .bg-float {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-float span {
    position: absolute;
    font-size: 180px;
    font-weight: 900;
    color: rgba(255,255,255,var(--float-opacity));
    letter-spacing: -8px;
    user-select: none;
    animation: floatAround 40s linear infinite;
    white-space: nowrap;
  }
  [data-theme="light"] .bg-float span { color: rgba(0,0,0,var(--float-opacity)); }
  .bg-float span:nth-child(1) { top: 5%; left: 0; animation-duration: 45s; }
  .bg-float span:nth-child(2) { top: 30%; left: -20%; animation-duration: 55s; animation-delay: -15s; }
  .bg-float span:nth-child(3) { top: 60%; left: 10%; animation-duration: 60s; animation-delay: -30s; }
  .bg-float span:nth-child(4) { top: 80%; left: -10%; animation-duration: 50s; animation-delay: -10s; }

  @keyframes floatAround {
    0%   { transform: translate(0,0) rotate(-5deg); }
    25%  { transform: translate(15vw,-5vh) rotate(2deg); }
    50%  { transform: translate(30vw,5vh) rotate(-3deg); }
    75%  { transform: translate(10vw,10vh) rotate(5deg); }
    100% { transform: translate(0,0) rotate(-5deg); }
  }

  .topbar {
    position: fixed;
    top: 24px; left: 24px; right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    font-size: 12px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    letter-spacing: 0.5px;
  }
  .bio-tag { color: var(--text-faint); cursor: none; transition: color 0.3s; }
  .bio-tag:hover { color: var(--text-tagline); }

  .menu-buttons { display: flex; gap: 8px; align-items: center; }

  .menu-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-family: inherit;
    cursor: none;
    transition: all 0.25s;
    letter-spacing: 0.5px;
  }
  .menu-btn:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); color: var(--text); }
  .menu-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--btn-active-bg); }

  .theme-toggle {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 14px;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    font-family: inherit;
  }
  .theme-toggle:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); transform: rotate(20deg); }

  .music-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    height: 36px;
    transition: all 0.25s;
  }
  .music-controls:hover { border-color: var(--btn-hover-border); }

  .music-btn {
    background: transparent;
    border: none;
    color: var(--btn-text);
    font-size: 14px;
    cursor: none;
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    font-family: inherit;
  }
  .music-btn:hover { background: var(--btn-hover-bg); color: var(--text); }
  .music-btn.playing { color: #fff; background: var(--btn-active-bg); }
  [data-theme="light"] .music-btn.playing { color: #000; }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 70px;
    height: 3px;
    background: var(--btn-border);
    border-radius: 3px;
    outline: none;
    cursor: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: var(--btn-text);
    border-radius: 50%;
    cursor: none;
  }
  .volume-slider::-moz-range-thumb {
    width: 12px; height: 12px;
    background: var(--btn-text);
    border-radius: 50%;
    cursor: none;
    border: none;
  }

  .main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 60px;
    text-align: center;
  }

  .logo {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 40px;
    font-size: 180px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -10px;
    color: var(--text);
    user-select: none;
    transition: color 0.4s;
  }

  .bang {
    display: inline-block;
    opacity: 0;
    transform: translateY(150px) scaleY(0);
    transform-origin: bottom center;
    animation: bangAppear 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
  }
  @keyframes bangAppear {
    0% { opacity: 0; transform: translateY(150px) scaleY(0); }
    100% { opacity: 1; transform: translateY(0) scaleY(1); }
  }

  .letter {
    display: inline-block;
    opacity: 0;
    transform: translateX(-60px);
    animation: letterSlide 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .letter:nth-child(2) { animation-delay: 0.75s; }
  .letter:nth-child(3) { animation-delay: 0.90s; }
  .letter:nth-child(4) { animation-delay: 1.05s; }
  .letter:nth-child(5) { animation-delay: 1.20s; }
  .letter:nth-child(6) { animation-delay: 1.35s; }
  @keyframes letterSlide {
    0% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  .tagline {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    color: var(--text-tagline);
    letter-spacing: 4px;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.6s forwards;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .description {
    max-width: 520px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.9s forwards;
  }

  .links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 2.1s forwards;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 11px 22px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--btn-text);
    text-decoration: none;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    transition: all 0.25s;
    letter-spacing: 0.3px;
    cursor: none;
  }
  .links a:hover { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--btn-active-bg); }
  .links a::after { content: "↗"; opacity: 0.5; font-size: 11px; }

  .clock {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1px;
    z-index: 10;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 40px 20px;
  }
  [data-theme="light"] .modal-overlay { background: rgba(255,255,255,0.85); }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--modal-bg);
    border: 1px solid var(--modal-border);
    border-radius: 16px;
    max-width: 800px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    padding: 24px 30px;
    border-bottom: 1px solid var(--modal-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-tagline);
    font-size: 24px;
    cursor: none;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body {
    padding: 20px 30px 30px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text-dim);
  }
  .modal-body ol { padding-left: 0; list-style: none; counter-reset: item; }
  .modal-body li { counter-increment: item; padding: 3px 0; }
  .modal-body li::before { content: counter(item) "."; display: inline-block; width: 45px; color: var(--text-faint); }
  .modal-body li:hover { color: var(--text); }

  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-track { background: var(--scroll-track); }
  .modal-body::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }

  @media (max-width: 640px) {
    .logo { font-size: 100px; letter-spacing: -5px; }
    .bg-float span { font-size: 100px; }
    .description { font-size: 14px; padding: 0 10px; }
    .topbar { top: 16px; left: 16px; right: 16px; gap: 8px; flex-wrap: wrap; }
    .clock { font-size: 11px; bottom: 16px; }
    .menu-btn { padding: 6px 12px; font-size: 11px; }
    .theme-toggle { width: 32px; height: 32px; font-size: 13px; }
    .music-controls { height: 32px; padding: 4px 8px 4px 4px; }
    .volume-slider { width: 50px; }
  }
</style>
</head>

    "Незаконный вылов рыбы","Браконьерство","Торговля редкими видами","Уничтожение экосистем",
    "Загрязнение окружающей среды","Выброс токсичных отходов","Незаконное захоронение отходов",
    "Разрушение озонового слоя","Изменение климата","Экологический терроризм","Экоцид","Биопиратство",
    "Незаконные генетические эксперименты","Клонирование человека","Торговля органами",
    "Незаконная трансплантация","Принудительное изъятие органов","Медицинские эксперименты над людьми",
    "Испытания на заключённых","Испытания на детях","Испытания на беременных","Отказ в вакцинации",
    "Распространение биологического оружия","Создание лабораторных утечек","Пандемия",
    "Сокрытие вспышек заболеваний","Дезинформация о здоровье","Продажа фальсифицированных лекарств",
    "Подделка вакцин","Незаконный оборот медицинских препаратов","Наркоторговля","Организация наркокартелей",
    "Отмывание наркодоходов","Финансирование наркоторговли","Вовлечение несовершеннолетних в наркоторговлю"
  ];

  const list = document.getElementById("chargesList");
  charges.forEach(c => {
    const li = document.createElement("li");
    li.textContent = c;
    list.appendChild(li);
  });

  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playClick() {
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 900;
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }

  const cursor = document.getElementById("cursor");
  const dot = document.getElementById("cursorDot");
  let mouseX = 0, mouseY = 0, curX = 0, curY = 0;

  document.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.classList.add("visible");
    dot.classList.add("visible");
    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  });

  document.addEventListener("mouseleave", () => {
    cursor.classList.remove("visible");
    dot.classList.remove("visible");
  });

  function animateCursor() {
    curX += (mouseX - curX) * 0.18;
    curY += (mouseY - curY) * 0.18;
    cursor.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%)`;
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  const themeToggle = document.getElementById("themeToggle");

  function applyTheme(t) {
    if (t === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      themeToggle.textContent = "☀";
    } else {
      document.documentElement.removeAttribute("data-theme");
      themeToggle.textContent = "☾";
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "light" ? "dark" : "light";
    localStorage.setItem("x3led-theme", next);
    applyTheme(next);
  }

  applyTheme(localStorage.getItem("x3led-theme") || "dark");

  function openModal() {
    document.getElementById("modal").classList.add("show");
    document.body.style.overflow = "hidden";
    document.querySelectorAll(".menu-btn")[1].classList.add("active");
    document.querySelectorAll(".menu-btn")[0].classList.remove("active");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("show");
    document.body.style.overflow = "";
    document.querySelectorAll(".menu-btn")[0].classList.add("active");
    document.querySelectorAll(".menu-btn")[1].classList.remove("active");
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  function updateClock() {
    const now = new Date();
    const msk = new Date(now.getTime() + (3 * 60 + now.getTimezoneOffset()) * 60000);
    const hh = String(msk.getHours()).padStart(2, "0");
    const mm = String(msk.getMinutes()).padStart(2, "0");
    const ss = String(msk.getSeconds()).padStart(2, "0");
    document.getElementById("clock").textContent = `у меня сейчас ${hh}:${mm}:${ss} мск`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  let noiseSource = null;
  let noiseGain = null;
  let musicPlaying = false;

  function buildNoiseBuffer(ctx) {
    const size = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < size; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (last + 0.02 * white) / 1.02;
      last = data[i];
      data[i] *= 3.5;
    }
    return buffer;
  }

  function startNoise() {
    const ctx = getCtx();
    if (ctx.state === "suspended") ctx.resume();
    noiseSource = ctx.createBufferSource();
    noiseSource.buffer = buildNoiseBuffer(ctx);
    noiseSource.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 600;
    noiseGain = ctx.createGain();
    noiseGain.gain.value = parseFloat(volumeSlider.value) / 100 * 0.35;
    noiseSource.connect(filter).connect(noiseGain).connect(ctx.destination);
    noiseSource.start();
    musicPlaying = true;
  }

  function stopNoise() {
    if (noiseSource) {
      try { noiseSource.stop(); } catch (e) {}
      noiseSource.disconnect();
      noiseSource = null;
    }
    musicPlaying = false;
  }

  function toggleMusic() {
    const btn = document.getElementById("musicBtn");
    if (musicPlaying) {
      stopNoise();
      btn.classList.remove("playing");
      btn.textContent = "♫";
    } else {
      startNoise();
      btn.classList.add("playing");
      btn.textContent = "❚❚";
    }
  }

  const volumeSlider = document.getElementById("volumeSlider");
  volumeSlider.addEventListener("input", () => {
    if (noiseGain) noiseGain.gain.value = parseFloat(volumeSlider.value) / 100 * 0.35;
  });

  document.querySelectorAll("a, button, .menu-btn, .theme-toggle, .bio-tag, .music-btn, .volume-slider").forEach(el => {
    el.addEventListener("mouseenter", () => cursor.classList.add("hover"));
    el.addEventListener("mouseleave", () => cursor.classList.remove("hover"));
  });

  document.querySelectorAll(".menu-btn, .theme-toggle, .links a, .modal-close, .music-btn").forEach(el => {
    el.addEventListener("click", playClick);
  });
</script>

</body>
</html>
