<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --text: #fff;
    --text-dim: #a0a0a0;
    --text-faint: #444;
    --text-tagline: #666;
    --border: #2a2a2a;
    --btn-bg: #161616;
    --btn-border: #222;
    --btn-text: #ccc;
    --btn-hover-bg: #1e1e1e;
    --btn-hover-border: #333;
    --btn-active-bg: #fff;
    --btn-active-text: #000;
    --modal-bg: #0f0f0f;
    --modal-border: #1e1e1e;
    --scroll-track: #0a0a0a;
    --scroll-thumb: #222;
    --scroll-thumb-hover: #333;
    --float-opacity: 0.018;
    --cursor-color: #fff;
  }

  [data-theme="light"] {
    --bg: #f5f5f5;
    --text: #0a0a0a;
    --text-dim: #555;
    --text-faint: #aaa;
    --text-tagline: #888;
    --border: #d0d0d0;
    --btn-bg: #ffffff;
    --btn-border: #d0d0d0;
    --btn-text: #333;
    --btn-hover-bg: #efefef;
    --btn-hover-border: #b0b0b0;
    --btn-active-bg: #000;
    --btn-active-text: #fff;
    --modal-bg: #ffffff;
    --modal-border: #e0e0e0;
    --scroll-track: #f5f5f5;
    --scroll-thumb: #ccc;
    --scroll-thumb-hover: #aaa;
    --float-opacity: 0.04;
    --cursor-color: #000;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    transition: background 0.4s ease, color 0.4s ease;
    cursor: none;
  }

  @media (hover: none) {
    html, body { cursor: auto; }
    .cursor { display: none !important; }
  }

  /* ---------- КУРСОР ---------- */
  .cursor {
    position: fixed;
    top: 0; left: 0;
    width: 20px; height: 20px;
    border: 1.5px solid var(--cursor-color);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition:
      width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
      height 0.25s cubic-bezier(0.16, 1, 0.3, 1),
      background 0.25s ease,
      border-color 0.25s ease,
      opacity 0.2s ease;
    mix-blend-mode: difference;
    opacity: 0;
  }

  .cursor.visible { opacity: 1; }
  .cursor.hover {
    width: 46px; height: 46px;
    background: rgba(255, 255, 255, 0.1);
  }

  [data-theme="light"] .cursor {
    mix-blend-mode: normal;
  }

  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 5px; height: 5px;
    background: var(--cursor-color);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    transition: opacity 0.2s ease;
    opacity: 0;
  }
  .cursor-dot.visible { opacity: 1; }

  /* ---------- ПЛАВАЮЩИЙ ФОН ---------- */
  .bg-float {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-float span {
    position: absolute;
    font-size: 180px;
    font-weight: 900;
    color: rgba(255, 255, 255, var(--float-opacity));
    letter-spacing: -8px;
    user-select: none;
    animation: floatAround 40s linear infinite;
    white-space: nowrap;
  }

  [data-theme="light"] .bg-float span {
    color: rgba(0, 0, 0, var(--float-opacity));
  }

  .bg-float span:nth-child(1) { top: 5%; left: 0; animation-duration: 45s; animation-delay: 0s; }
  .bg-float span:nth-child(2) { top: 30%; left: -20%; animation-duration: 55s; animation-delay: -15s; }
  .bg-float span:nth-child(3) { top: 60%; left: 10%; animation-duration: 60s; animation-delay: -30s; }
  .bg-float span:nth-child(4) { top: 80%; left: -10%; animation-duration: 50s; animation-delay: -10s; }

  @keyframes floatAround {
    0%   { transform: translate(0, 0) rotate(-5deg); }
    25%  { transform: translate(15vw, -5vh) rotate(2deg); }
    50%  { transform: translate(30vw, 5vh) rotate(-3deg); }
    75%  { transform: translate(10vw, 10vh) rotate(5deg); }
    100% { transform: translate(0, 0) rotate(-5deg); }
  }

  /* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
  .topbar {
    position: fixed;
    top: 24px; left: 24px; right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    font-size: 12px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    letter-spacing: 0.5px;
  }

  .bio-tag {
    color: var(--text-faint);
    cursor: none;
    transition: color 0.3s ease;
  }
  .bio-tag:hover { color: var(--text-tagline); }

  .menu-buttons {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .menu-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-family: inherit;
    cursor: none;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
  }
  .menu-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
    color: var(--text);
  }
  .menu-btn.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }

  .theme-toggle {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 14px;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .theme-toggle:hover {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
    transform: rotate(20deg);
  }

  /* ---------- ЦЕНТР ---------- */
  .main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 60px;
    text-align: center;
  }

  /* ---------- ЛОГОТИП ---------- */
  .logo {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    margin-bottom: 40px;
    font-size: 180px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -10px;
    color: var(--text);
    position: relative;
    user-select: none;
    transition: color 0.4s ease;
  }

  .bang {
    display: inline-block;
    opacity: 0;
    transform: translateY(150px) scaleY(0);
    transform-origin: bottom center;
    animation: bangAppear 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
  }

  @keyframes bangAppear {
    0% { opacity: 0; transform: translateY(150px) scaleY(0); }
    100% { opacity: 1; transform: translateY(0) scaleY(1); }
  }

  .letter {
    display: inline-block;
    opacity: 0;
    transform: translateX(-60px);
    animation: letterSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .letter:nth-child(2) { animation-delay: 0.75s; }
  .letter:nth-child(3) { animation-delay: 0.90s; }
  .letter:nth-child(4) { animation-delay: 1.05s; }
  .letter:nth-child(5) { animation-delay: 1.20s; }
  .letter:nth-child(6) { animation-delay: 1.35s; }

  @keyframes letterSlide {
    0% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* ---------- ПОДПИСЬ ---------- */
  .tagline {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    color: var(--text-tagline);
    letter-spacing: 4px;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.6s forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---------- ОПИСАНИЕ ---------- */
  .description {
    max-width: 520px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.9s forwards;
  }

  /* ---------- ССЫЛКИ ---------- */
  .links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 2.1s forwards;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 11px 22px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--btn-text);
    text-decoration: none;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    transition: all 0.25s ease;
    letter-spacing: 0.3px;
    cursor: none;
  }

  .links a:hover {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }

  .links a::after {
    content: "↗";
    opacity: 0.5;
    font-size: 11px;
  }

  /* ---------- ЧАСЫ ---------- */
  .clock {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1px;
    z-index: 10;
  }

  /* ---------- КООРДИНАТЫ ---------- */
  .coords {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1px;
    z-index: 10;
  }

  /* ---------- МОДАЛЬНОЕ ОКНО ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 40px 20px;
  }

  [data-theme="light"] .modal-overlay {
    background: rgba(255, 255, 255, 0.85);
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--modal-bg);
    border: 1px solid var(--modal-border);
    border-radius: 16px;
    max-width: 800px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: modalIn 0.3s ease;
    transition: background 0.4s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    padding: 24px 30px;
    border-bottom: 1px solid var(--modal-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-header h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-tagline);
    font-size: 24px;
    cursor: none;
    transition: color 0.2s;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body {
    padding: 20px 30px 30px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text-dim);
  }

  .modal-body ol {
    padding-left: 0;
    list-style: none;
    counter-reset: item;
  }

  .modal-body li {
    counter-increment: item;
    padding: 3px 0;
    color: var(--text-dim);
    transition: color 0.15s;
  }

  .modal-body li::before {
    content: counter(item) ".";
    display: inline-block;
    width: 45px;
    color: var(--text-faint);
  }

  .modal-body li:hover { color: var(--text); }

  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-track { background: var(--scroll-track); }
  .modal-body::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
  .modal-body::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

  /* ---------- МОБИЛЬНЫЙ ---------- */
  @media (max-width: 640px) {
    .logo { font-size: 100px; letter-spacing: -5px; }
    .bg-float span { font-size: 100px; }
    .description { font-size: 14px; padding: 0 10px; }
    .topbar { top: 16px; left: 16px; right: 16px; gap: 8px; }
    .clock, .coords { font-size: 11px; bottom: 16px; }
    .modal-header { padding: 18px 20px; }
    .modal-body { padding: 15px 20px 25px; }
    .menu-btn { padding: 6px 12px; font-size: 11px; }
    .theme-toggle { width: 32px; height: 32px; font-size: 13px; }
  }
</style>
</head>

    "Угон транспортных средств","Захват заложников на транспорте","Морское пиратство","Воздушное пиратство",
    "Незаконный захват судов","Контрабанда оружия","Контрабанда наркотиков","Контрабанда людей",
    "Контрабанда культурных ценностей","Незаконная добыча ресурсов","Незаконная вырубка лесов",
    "Незаконный вылов рыбы","Браконьерство","Торговля редкими видами","Уничтожение экосистем",
    "Загрязнение окружающей среды","Выброс токсичных отходов","Незаконное захоронение отходов",
    "Разрушение озонового слоя","Изменение климата","Экологический терроризм","Экоцид","Биопиратство",
    "Незаконные генетические эксперименты","Клонирование человека","Торговля органами",
    "Незаконная трансплантация","Принудительное изъятие органов","Медицинские эксперименты над людьми",
    "Испытания на заключённых","Испытания на детях","Испытания на беременных","Отказ в вакцинации",
    "Распространение биологического оружия","Создание лабораторных утечек","Пандемия",
    "Сокрытие вспышек заболеваний","Дезинформация о здоровье","Продажа фальсифицированных лекарств",
    "Подделка вакцин","Незаконный оборот медицинских препаратов","Наркоторговля","Организация наркокартелей",
    "Отмывание наркодоходов","Финансирование наркоторговли","Вовлечение несовершеннолетних в наркоторговлю"
  ];

  const list = document.getElementById("chargesList");
  charges.forEach(c => {
    const li = document.createElement("li");
    li.textContent = c;
    list.appendChild(li);
  });

  // ============ ЗВУК КЛИКА (Web Audio) ============
  let audioCtx = null;
  function playClick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 900;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.08);
    } catch (e) { /* тихо игнорируем */ }
  }

  // Вешаем звук на все кнопки и ссылки
  document.querySelectorAll(".menu-btn, .theme-toggle, .links a, .modal-close").forEach(el => {
    el.addEventListener("click", playClick);
  });

  // ============ КУРСОР ============
  const cursor = document.getElementById("cursor");
  const dot = document.getElementById("cursorDot");

  let mouseX = 0, mouseY = 0;
  let curX = 0, curY = 0;

  document.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.classList.add("visible");
    dot.classList.add("visible");
    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  });

  document.addEventListener("mouseleave", () => {
    cursor.classList.remove("visible");
    dot.classList.remove("visible");
  });

  function animateCursor() {
    curX += (mouseX - curX) * 0.18;
    curY += (mouseY - curY) * 0.18;
    cursor.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%)`;
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.querySelectorAll("a, button, .menu-btn, .theme-toggle, .bio-tag").forEach(el => {
    el.addEventListener("mouseenter", () => cursor.classList.add("hover"));
    el.addEventListener("mouseleave", () => cursor.classList.remove("hover"));
  });

  // ============ ТЕМА ============
  const themeToggle = document.getElementById("themeToggle");

  function applyTheme(theme) {
    if (theme === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      themeToggle.textContent = "☀";
    } else {
      document.documentElement.removeAttribute("data-theme");
      themeToggle.textContent = "☾";
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "light" ? "dark" : "light";
    localStorage.setItem("x3led-theme", next);
    applyTheme(next);
  }

  const savedTheme = localStorage.getItem("x3led-theme") || "dark";
  applyTheme(savedTheme);

  // ============ МОДАЛКА ============
  function openModal() {
    document.getElementById("modal").classList.add("show");
    document.body.style.overflow = "hidden";
    document.querySelectorAll(".menu-btn")[1].classList.add("active");
    document.querySelectorAll(".menu-btn")[0].classList.remove("active");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("show");
    document.body.style.overflow = "";
    document.querySelectorAll(".menu-btn")[0].classList.add("active");
    document.querySelectorAll(".menu-btn")[1].classList.remove("active");
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  // ============ ЧАСЫ МСК ============
  function updateClock() {
    const now = new Date();
    const msk = new Date(now.getTime() + (3 * 60 + now.getTimezoneOffset()) * 60000);
    const hh = String(msk.getHours()).padStart(2, "0");
    const mm = String(msk.getMinutes()).padStart(2, "0");
    const ss = String(msk.getSeconds()).padStart(2, "0");
    document.getElementById("clock").textContent = `у меня сейчас ${hh}:${mm}:${ss} мск`;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
